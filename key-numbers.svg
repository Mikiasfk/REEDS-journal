<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 298" role="img" font-family="Public Sans,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Six key numbers</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="380" height="298" rx="12" fill="#F5F7F4"/><rect x="14" y="14" width="168" height="80" rx="8" fill="#fff" stroke="#D9DFDB"/><text x="26" y="30" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#56645F">Bilateral trade, 2025</text><text x="26" y="54" text-anchor="start" dominant-baseline="central" font-size="24" font-weight="600" fill="#1D6B4F">$435M+</text><text x="26" y="78" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#7A8884">almost tripled in a year</text><rect x="198" y="14" width="168" height="80" rx="8" fill="#fff" stroke="#D9DFDB"/><text x="210" y="30" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#56645F">Coffee exports to Russia</text><text x="210" y="54" text-anchor="start" dominant-baseline="central" font-size="24" font-weight="600" fill="#1D6B4F">+60%</text><text x="210" y="78" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#7A8884">reported surge, 2025</text><rect x="14" y="106" width="168" height="80" rx="8" fill="#fff" stroke="#D9DFDB"/><text x="26" y="122" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#56645F">Proposed reactor units</text><text x="26" y="146" text-anchor="start" dominant-baseline="central" font-size="24" font-weight="600" fill="#1D6B4F">2 × 1.2 GW</text><text x="26" y="170" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#7A8884">2024 proposal to the IAEA</text><rect x="198" y="106" width="168" height="80" rx="8" fill="#fff" stroke="#D9DFDB"/><text x="210" y="122" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#56645F">Proposed window</text><text x="210" y="146" text-anchor="start" dominant-baseline="central" font-size="24" font-weight="600" fill="#1D6B4F">2032–34</text><text x="210" y="170" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#7A8884">not an official schedule</text><rect x="14" y="198" width="168" height="80" rx="8" fill="#fff" stroke="#D9DFDB"/><text x="26" y="214" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#56645F">Rosatom scholarships a year</text><text x="26" y="238" text-anchor="start" dominant-baseline="central" font-size="24" font-weight="600" fill="#1D6B4F">300+</text><text x="26" y="262" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#7A8884">Ethiopia is on the list</text><rect x="198" y="198" width="168" height="80" rx="8" fill="#fff" stroke="#D9DFDB"/><text x="210" y="214" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#56645F">African nuclear agreements</text><text x="210" y="238" text-anchor="start" dominant-baseline="central" font-size="24" font-weight="600" fill="#1D6B4F">15</text><text x="210" y="262" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#7A8884">Rosatom, as of March 2026</text></svg>