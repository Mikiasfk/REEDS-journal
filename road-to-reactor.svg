<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 456" role="img" font-family="Public Sans,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Road from action plan to nuclear plant</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="380" height="456" rx="12" fill="#F5F7F4"/><rect x="40" y="24" width="300" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="190.0" y="41.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Dedicated working group</text><text x="190.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">Refines the plant project</text><line x1="190" y1="76" x2="190" y2="102" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="104" width="300" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="190.0" y="121.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Strategic roadmap</text><text x="190.0" y="141.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">Signed March 31, 2026</text><line x1="190" y1="156" x2="190" y2="182" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="184" width="300" height="52" rx="8" fill="#ECEBE5" stroke="#5F5E5A"/><text x="190.0" y="201.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Feasibility study</text><text x="190.0" y="221.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Site, size, cost, schedule</text><line x1="190" y1="236" x2="190" y2="262" stroke="#5F5E5A" stroke-width